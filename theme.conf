[General]
# Asset paths are relative to this theme directory. `Background` can also be
# an absolute file URL such as file:///home/name/Pictures/wallpaper.jpg.
Background=assets/wallpaper.svg

# Terminal palette. PanelColor uses #AARRGGBB, where AA controls transparency.
TextColor=#8dff72
DimTextColor=#4b9d58
CursorColor=#b7ff9e
PanelColor=#c908110a
PanelBorderColor=#6c8dff72

# Wallpaper treatment. Both values accept decimals from 0.0 to 1.0.
BackgroundOpacity=0.66
BackgroundBlur=0.16

# Boot and transition timing, in milliseconds.
# TypingSpeed is the delay between individual characters.
# BootDelay is the pause after each completed boot line.
TypingSpeed=24
BootDelay=125
BootSettleDelay=650
AnimationDuration=650
